name: GodRender parallel production rendering
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest inside projects/ or fixtures/ (when not using synthetic fixture)"
        type: string
        required: false
        default: ""
      fixture:
        description: "Run synthetic technical proof, never approved film"
        type: boolean
        required: true
        default: true
  pull_request:
    paths: ['render/**','tests/test_render_runtime.py','.github/workflows/godrender-production-render.yml']
  push:
    branches: ['integration/production-runtime-7systems-20261018']
permissions:
  contents: read
concurrency:
  group: technical-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
      source_sha: ${{ steps.sources.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install image toolkit
        run: python -m pip install numpy opencv-python-headless
      - name: Create SHA-pinned source bundle and matrix
        id: sources
        env:
          MANIFEST_INPUT: ${{ inputs.manifest }}
          FIXTURE_INPUT: ${{ inputs.fixture }}
          EVENT_KIND: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godrender-input"
          python - <<'PY'
          import json,os,shutil,sys
          from pathlib import Path
          sys.path.insert(0,"render")
          from godrender_runtime import fixture,manifest_load,within,plan
          root=Path.cwd().resolve();out=Path(os.environ["RUNNER_TEMP"])/"godrender-input"
          requested=os.environ.get("MANIFEST_INPUT","")
          fixture_mode=os.environ.get("EVENT_KIND")!="workflow_dispatch" or os.environ.get("FIXTURE_INPUT","true").lower()=="true"
          if fixture_mode:
              fixture(out,out/"manifest.json")
          else:
              if not requested or not requested.startswith(("projects/","fixtures/")):
                  raise SystemExit("authorized real manifest must live in projects/ or fixtures/")
              src=within(root,requested)
              if not src.is_file():raise SystemExit("manifest missing")
              data=manifest_load(src,root)
              shutil.copyfile(src,out/"manifest.json")
              for rec in [data.get("audio")]+[s.get("image") or s.get("video") for s in data["shots"]]:
                  if rec:
                      p=within(root,rec["path"]);target=within(out,rec["path"])
                      target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)
          doc=manifest_load(out/"manifest.json",out)
          matrix=plan(doc,out/"shard_plan.json")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("matrix="+json.dumps(matrix,separators=(",",":"))+"\n")
              f.write("source_sha="+os.environ["GITHUB_SHA"]+"\n")
          print("GODRENDER SOURCE PASS",len(matrix["include"]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godrender-source-${{ github.run_id }}
          path: ${{ runner.temp }}/godrender-input/
          retention-days: 3
  render-shot:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install real FX dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Install FFmpeg/FFprobe for pixel encoding
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: godrender-source-${{ github.run_id }}
          path: ${{ runner.temp }}/input
      - name: Render source frames with approved FXExecutor
        run: |
          python render/godrender_runtime.py shot --manifest "$RUNNER_TEMP/input/manifest.json" --input-root "$RUNNER_TEMP/input" --shot-id "${{ matrix.shot_id }}" --out "$RUNNER_TEMP/shot"
          test -s "$RUNNER_TEMP/shot/${{ matrix.shot_id }}.mp4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: godrender-shot-${{ matrix.shot_id }}
          path: ${{ runner.temp }}/shot/
          retention-days: 30
          if-no-files-found: warn
  assemble:
    needs: [plan, render-shot]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: godrender-source-${{ github.run_id }}
          path: ${{ runner.temp }}/input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: godrender-shot-*
          path: ${{ runner.temp }}/shards
          merge-multiple: false
      - name: Install FFmpeg/FFprobe for mux and verification
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg
      - name: Restore shard IDs from artifact names
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"shards"
          for p in root.iterdir():
              if p.is_dir() and p.name.startswith("godrender-shot-"):
                  p.rename(root/p.name.removeprefix("godrender-shot-"))
          PY
      - name: Assemble verified actual MP4 and audio
        run: |
          python render/godrender_runtime.py assemble --manifest "$RUNNER_TEMP/input/manifest.json" --input-root "$RUNNER_TEMP/input" --shards "$RUNNER_TEMP/shards" --out "$RUNNER_TEMP/final"
          test -s "$RUNNER_TEMP/final/godrender_review.mp4"
          ffprobe -v error -show_entries stream=codec_type -of compact "$RUNNER_TEMP/final/godrender_review.mp4"
      - name: Sync actual receipt to Drive Brain when authenticated
        env:
          GODRENDER_DRIVE_SA_JSON: ${{ secrets.GODRENDER_DRIVE_SA_JSON }}
          GODRENDER_DRIVE_SHEET: "1Xi2wSER-vEIjy52FTKA5RvMXNnGrTxoYiEoPhyXw77c"
        run: |
          if [ -n "$GODRENDER_DRIVE_SA_JSON" ]; then python -m pip install google-auth requests; fi
          python render/brain_sync.py --receipt "$RUNNER_TEMP/final/render_receipt.json"             --run-url "https://github.com/SouthPaw302/GodRender/actions/runs/${{ github.run_id }}"             --outbox "$RUNNER_TEMP/final/BRAIN_OUTBOX.json"
      - name: Verify production is not creatively approved
        shell: bash
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"final/render_receipt.json").read_text())
          assert d["status"]=="TECHNICAL_RENDER_PASS_VISUAL_REVIEW_PENDING"
          assert not d["production_complete"] and not d["human_visual_approval"]
          assert d["sha256"] and d["shards"] and all(s["nonidentical_frames"] for s in d["shards"])
          print("GODRENDER REAL TECHNICAL MP4 PASS; DIRECTOR REVIEW PENDING")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: godrender-review-film-${{ github.run_id }}
          path: ${{ runner.temp }}/final/
          retention-days: 30
          if-no-files-found: warn
