name: Nordic B06 Director Edit FX
on:
  workflow_dispatch:
  push:
    branches: ['song/nordic-remastered']
    paths:
      - 'projects/nordic-remastered/runner_sources/batch-06/**'
      - 'projects/nordic-remastered/production/B06_DIRECTOR_EDIT_FX_MANIFEST.json'
      - 'projects/nordic-remastered/production/B06_FX_REQUIREMENTS.fx.json'
      - 'projects/nordic-remastered/production/render_b06_director_fx.py'
      - '.github/workflows/nordic-b06-director-fx.yml'
permissions:
  contents: read
concurrency:
  group: nordic-b06-director-fx-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy opencv-python-headless pillow google-auth requests
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg unzip
      - name: Pin current native main authority
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git branch --force main refs/remotes/origin/main
          echo "MAIN=$(git rev-parse main)"
          echo "B06=$(git rev-parse HEAD)"
      - name: Verify native GodRender sources
        run: python tools/verify_consolidation.py
      - name: Native GodRender boot
        env:
          GODRENDER_VALIDATION_MODE: '1'
        run: python3 godrender_boot.py --offline
      - name: Recover hash-locked source media from sandbox-staged Git blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b06/stills"
          cat projects/nordic-remastered/runner_sources/batch-06/storyboard.zip.b64part* | base64 -d > "$RUNNER_TEMP/b06/B06.zip"
          echo "ca31e1bef59dd2332e193596a5840c241d22888c6e7242c4c0704f69bccd80b4  $RUNNER_TEMP/b06/B06.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/b06/B06.zip" -d "$RUNNER_TEMP/b06/stills"
          cat projects/nordic-remastered/runner_sources/batch-03/source_video_b.mp4.part* > "$RUNNER_TEMP/b06/source_video_b.mp4"
          echo "79b7a65bef53cfd35fc9905c9ea4f09ee8a96bcf794e9296596c49d0c5933e68  $RUNNER_TEMP/b06/source_video_b.mp4" | sha256sum -c -
          cat projects/nordic-remastered/runner_sources/audio/Nordic_Remastered.mp3.part* > "$RUNNER_TEMP/b06/Nordic_Remastered.mp3"
          echo "d5dc263e6edc7a248503acc1f8ecc5cc2ab91727905ef8ddac3d63a6a1644c2f  $RUNNER_TEMP/b06/Nordic_Remastered.mp3" | sha256sum -c -
      - name: Validate exact B06 picture and timeline
        run: |
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          z=zipfile.ZipFile(Path(os.environ["RUNNER_TEMP"])/"b06/B06.zip")
          d=json.loads(Path("projects/nordic-remastered/production/B06_DIRECTOR_EDIT_FX_MANIFEST.json").read_text())
          assert d["total_frames"]==567
          assert sum(int(x["frames"]) for x in d["timeline"])==567
          assert sum(int(x["frames"]) for x in d["timeline"][:-1])==376
          assert d["timeline"][-1]["type"]=="quiet_hold"
          assert len([x for x in d["timeline"] if x["type"]=="source_video_bridge"])==2
          for s in d["selected_stills"]:
              assert hashlib.sha256(z.read(s["file"])).hexdigest()==s["sha256"],s["id"]
          print("B06 EXACT PICTURE, SOURCE, TIMELINE PASS")
          PY
      - name: Compile registered GodRender FX authority
        run: python general/reusable/fx_v2/precompile_gate.py --manifest projects/nordic-remastered/production/B06_FX_REQUIREMENTS.fx.json --lock-out "$RUNNER_TEMP/b06/fx.lock.json"
      - name: Render native B06 Director edit FX
        run: |
          python projects/nordic-remastered/production/render_b06_director_fx.py \
            --manifest projects/nordic-remastered/production/B06_DIRECTOR_EDIT_FX_MANIFEST.json \
            --input-root "$RUNNER_TEMP/b06/stills" \
            --storyboard-zip "$RUNNER_TEMP/b06/B06.zip" \
            --video-b "$RUNNER_TEMP/b06/source_video_b.mp4" \
            --audio "$RUNNER_TEMP/b06/Nordic_Remastered.mp3" \
            --out "$RUNNER_TEMP/final"
      - name: Verify exact 567 frames and original segment A/V
        shell: bash
        run: |
          set -euo pipefail
          film="$RUNNER_TEMP/final/NORDIC_B06_DIRECTOR_EDIT_FX_720p.mp4"
          ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=nb_read_frames,width,height,r_frame_rate \
            -show_entries format=duration,size -of json "$film" | tee "$RUNNER_TEMP/final/ffprobe.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"final/ffprobe.json"
          d=json.loads(p.read_text()); s=d["streams"][0]
          assert s["width"]==1280 and s["height"]==720 and s["r_frame_rate"]=="24/1"
          assert int(s["nb_read_frames"])==567
          assert abs(float(d["format"]["duration"])-23.625)<0.04
          print("B06 567-FRAME TECHNICAL QC PASS")
          PY
          ffmpeg -v error -xerror -i "$film" -map 0:v -f null - -map 0:a -f null -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nordic-b06-director-edit-fx-${{ github.run_id }}
          path: ${{ runner.temp }}/final/
          retention-days: 30
