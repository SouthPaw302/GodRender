name: Nordic ONNX Python 3.13 runtime bundle

on:
  push:
    branches:
      - integration/production-runtime-7systems-20261018
    paths:
      - .github/workflows/nordic-onnx-scan.yml

permissions:
  contents: read

jobs:
  runtime313:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Download Linux cp313 ONNX runtime wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nordic-onnx-py313"
          python -m pip download --disable-pip-version-check --only-binary=:all:             "numpy==2.4.6" "onnxruntime==1.31.0"             -d "$RUNNER_TEMP/nordic-onnx-py313"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"nordic-onnx-py313"
          files=sorted(p.name for p in root.iterdir())
          (root/"RUNTIME_RECEIPT.json").write_text(json.dumps({
            "schema":"godrender.nordic-onnx-py313-runtime.v1",
            "python":"3.13",
            "onnxruntime":"1.31.0",
            "numpy":"2.4.6",
            "files":files
          },indent=2)+"\n")
          print("\n".join(files))
          PY

      - name: Upload Python 3.13 runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nordic-onnx-py313
          path: ${{ runner.temp }}/nordic-onnx-py313/
          retention-days: 3
          if-no-files-found: error
