name: Nordic ONNX model bundle

on:
  push:
    branches:
      - integration/production-runtime-7systems-20261018
    paths:
      - .github/workflows/nordic-onnx-scan.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact GodRender main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Fetch registry-pinned Beat This model bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nordic-onnx-bundle/wheels"
          python - <<'PY'
          import hashlib, urllib.request, os
          from pathlib import Path
          url="https://raw.githubusercontent.com/mosynthkey/beat_this_cpp/07ab790a9ec2eda8093d52d249e3ec4f0510ee72/onnx/beat_this.onnx"
          target=Path(os.environ["RUNNER_TEMP"])/"nordic-onnx-bundle/beat_this.onnx"
          req=urllib.request.Request(url,headers={"User-Agent":"GodRender-Nordic-Model-Stage/1"})
          with urllib.request.urlopen(req,timeout=240) as r,target.open("wb") as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          data=target.read_bytes()
          blob=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
          if len(data)!=83077778:
              raise SystemExit(f"model size mismatch {len(data)}")
          if blob!="e2363cec9872bacf8867945b71ddaed879089995":
              raise SystemExit(f"model blob mismatch {blob}")
          print("PINNED BEAT THIS MODEL PASS",len(data),blob)
          PY

      - name: Build portable sandbox bundle
        shell: bash
        run: |
          set -euo pipefail
          cp engine/general/reusable/tools/music_beat_worker.py "$RUNNER_TEMP/nordic-onnx-bundle/music_beat_worker.py"
          cp engine/general/reusable/tools/model_registry.py "$RUNNER_TEMP/nordic-onnx-bundle/model_registry.py"
          cp engine/general/reusable/intelligence/MODEL_REGISTRY.json "$RUNNER_TEMP/nordic-onnx-bundle/MODEL_REGISTRY.json"
          python -m pip download --disable-pip-version-check --only-binary=:all:             "numpy==2.4.6" "onnxruntime==1.31.0"             -d "$RUNNER_TEMP/nordic-onnx-bundle/wheels"
          ENGINE_SHA="$(git -C engine rev-parse HEAD)" python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"nordic-onnx-bundle"
          model=root/"beat_this.onnx"; b=model.read_bytes()
          receipt={
            "schema":"godrender.nordic-onnx-sandbox-bundle.v1",
            "engine_commit":os.environ["ENGINE_SHA"],
            "model_id":"music-beat-onnx-v1",
            "model_version":"beat-this-final0-onnx14",
            "model_bytes":len(b),
            "model_git_blob_sha1":hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest(),
            "source_commit":"07ab790a9ec2eda8093d52d249e3ec4f0510ee72",
            "onnxruntime":"1.31.0",
            "numpy":"2.4.6",
            "note":"Direct byte staging used because current main model_provision rejects current registry schema before download."
          }
          (root/"BUNDLE_RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          PY

      - name: Upload pinned model/runtime bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nordic-onnx-sandbox-bundle
          path: ${{ runner.temp }}/nordic-onnx-bundle/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
