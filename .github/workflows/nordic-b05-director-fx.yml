name: Nordic B05 Director Edit FX
on:
  workflow_dispatch:
  push:
    branches: ['song/nordic-remastered']
    paths:
      - 'projects/nordic-remastered/runner_sources/batch-05/**'
      - 'projects/nordic-remastered/production/B05_DIRECTOR_EDIT_FX_MANIFEST.json'
      - 'projects/nordic-remastered/production/B05_FX_REQUIREMENTS.fx.json'
      - 'projects/nordic-remastered/production/render_b05_director_fx.py'
      - '.github/workflows/nordic-b05-director-fx.yml'
permissions:
  contents: read
concurrency:
  group: nordic-b05-director-fx-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a503750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy opencv-python-headless pillow google-auth requests
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg unzip
      - name: Fetch exact Main authority for native boot
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git branch --force main refs/remotes/origin/main
          echo "MAIN=$(git rev-parse main)"
          echo "B05=$(git rev-parse HEAD)"
      - name: Verify consolidated native sources
        run: python tools/verify_consolidation.py
      - name: Boot GodRender
        env:
          GODRENDER_VALIDATION_MODE: '1'
        run: python3 godrender_boot.py --offline
      - name: Reassemble exact sandbox-staged B05 media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b05" "$RUNNER_TEMP/b05/stills"
          cat projects/nordic-remastered/runner_sources/batch-05/storyboard.zip.part* > "$RUNNER_TEMP/b05/B05.zip"
          echo "e3609729dd069c5f3ef970a27ef9e26d7b0206a07772cd742921030b5b148abe  $RUNNER_TEMP/b05/B05.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/b05/B05.zip" -d "$RUNNER_TEMP/b05/stills"
          cat projects/nordic-remastered/runner_sources/batch-03/source_video_b.mp4.part* > "$RUNNER_TEMP/b05/source_video_b.mp4"
          echo "79b7a65bef53cfd35fc9905c9ea4f09ee8a96bcf794e9296596c49d0c5933e68  $RUNNER_TEMP/b05/source_video_b.mp4" | sha256sum -c -
          cat projects/nordic-remastered/runner_sources/audio/Nordic_Remastered.mp3.part* > "$RUNNER_TEMP/b05/Nordic_Remastered.mp3"
          echo "d5dc263e6edc7a248503acc1f8ecc5cc2ab91727905ef8ddac3d63a6a1644c2f  $RUNNER_TEMP/b05/Nordic_Remastered.mp3" | sha256sum -c -
          echo "B05 SANDBOX-TO-RUNNER SOURCE HASH PASS"
      - name: Verify selected source still hashes
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"b05/stills"
          d=json.loads(Path("projects/nordic-remastered/production/B05_DIRECTOR_EDIT_FX_MANIFEST.json").read_text())
          for s in d["selected_stills"]:
              p=root/s["file"]; assert p.is_file(), p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==s["sha256"], s["id"]
          assert sum(int(x["frames"]) for x in d["timeline"])==503
          assert len([x for x in d["timeline"] if x["type"]=="source_video_bridge"])==2
          assert sum(x["frames"] for x in d["timeline"][:-1])==377
          assert d["timeline"][-1]["type"]=="quiet_breath"
          print("B05 SELECTED SOURCE + TIMELINE PASS")
          PY
      - name: Compile FX lock
        run: python general/reusable/fx_v2/precompile_gate.py --manifest projects/nordic-remastered/production/B05_FX_REQUIREMENTS.fx.json --lock-out "$RUNNER_TEMP/b05/fx.lock.json"
      - name: Render B05 continuous edit
        run: |
          python projects/nordic-remastered/production/render_b05_director_fx.py \
            --manifest projects/nordic-remastered/production/B05_DIRECTOR_EDIT_FX_MANIFEST.json \
            --input-root "$RUNNER_TEMP/b05/stills" \
            --video-b "$RUNNER_TEMP/b05/source_video_b.mp4" \
            --storyboard-zip "$RUNNER_TEMP/b05/B05.zip" \
            --audio "$RUNNER_TEMP/b05/Nordic_Remastered.mp3" \
            --out "$RUNNER_TEMP/final"
      - name: QC exact B05 duration and frame count
        run: |
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames,width,height,r_frame_rate -show_entries format=duration,size -of json "$RUNNER_TEMP/final/NORDIC_B05_DIRECTOR_EDIT_FX_720p.mp4" | tee "$RUNNER_TEMP/final/ffprobe.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"final/ffprobe.json").read_text())
          assert int(d["streams"][0]["nb_read_frames"])==503, d
          dur=float(d["format"]["duration"]); assert 20.94 <= dur <= 21.02, dur
          print("B05 503-FRAME QC PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nordic-b05-director-edit-fx-${{ github.run_id }}
          path: ${{ runner.temp }}/final/
          retention-days: 30
