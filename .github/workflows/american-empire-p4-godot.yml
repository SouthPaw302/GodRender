name: American Empire P4 Godot World Explorer

on:
  push:
    branches:
      - world/american-empire
    paths:
      - 'worlds/american-empire/**'
      - '.github/workflows/american-empire-p4-godot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-world-explorer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: "4.7.2-stable"
      GODOT_ZIP_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_GL_VERSION_OVERRIDE: "3.3"
    steps:
      - name: Checkout exact world branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify original canon and existing engines
        shell: bash
        run: |
          set -euo pipefail
          python3 worlds/american-empire/tools/verify_canon.py
          python3 -m unittest discover -s worlds/american-empire/tests -p 'test_*.py' -v
      - name: Generate deterministic scenario/data bundle without touching canon
        shell: bash
        run: |
          set -euo pipefail
          python3 worlds/american-empire/tools/build_explorer_bundle.py --check-reproducible
          python3 worlds/american-empire/tools/launch_explorer.py --prepare-only
          mkdir -p "$RUNNER_TEMP/american-empire-p4"
          cp worlds/american-empire/godot/data/world_bundle.json "$RUNNER_TEMP/american-empire-p4/world_bundle.json"
      - name: Install Xvfb and software OpenGL dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libxrender1 libasound2t64 ffmpeg unzip curl
      - name: Download official Godot and verify established SHA256
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o /tmp/godot-p4.zip
          printf "%s  %s\n" "$GODOT_ZIP_SHA256" /tmp/godot-p4.zip | sha256sum -c -
          unzip -q /tmp/godot-p4.zip -d /tmp/godot-p4-bin
          chmod +x "/tmp/godot-p4-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          "/tmp/godot-p4-bin/Godot_v${GODOT_VERSION}_linux.x86_64" --version
      - name: Import Godot 4 project metadata and parse scripts
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot-p4-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$GODOT" --headless --path worlds/american-empire/godot --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/american-empire-p4/import.log"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "$RUNNER_TEMP/american-empire-p4/import.log"; then
            exit 1
          fi
      - name: Render actual interactive viewport and programmed proof controls
        shell: bash
        run: |
          set -euo pipefail
          GODOT="/tmp/godot-p4-bin/Godot_v${GODOT_VERSION}_linux.x86_64"
          OUT="$RUNNER_TEMP/american-empire-p4"
          PROJ="$GITHUB_WORKSPACE/worlds/american-empire/godot"
          xvfb-run -a -s "-screen 0 1600x1000x24" "$GODOT" \
            --path "$PROJ" --rendering-method gl_compatibility \
            --write-movie "$OUT/proof.png" --fixed-fps 24 --quit-after 48 \
            -- --proof-cycle 2>&1 | tee "$OUT/godot.log"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -framerate 24 -i "$OUT/proof%08d.png" \
            -c:v libx264 -preset fast -crf 24 -pix_fmt yuv420p "$OUT/proof.mp4"
          cp "$OUT/proof00000002.png" "$OUT/preview-2027-baseline.png"
          cp "$OUT/proof00000017.png" "$OUT/preview-2029-baseline.png"
          cp "$OUT/proof00000031.png" "$OUT/preview-2029-independent.png"
          cp "$OUT/proof00000044.png" "$OUT/preview-2033-independent.png"
      - name: Verify images, UI changes, logs and movie
        run: |
          python3 worlds/american-empire/tools/verify_godot_proof.py \
            --root "$RUNNER_TEMP/american-empire-p4" --source-sha "$GITHUB_SHA"
      - name: Retain only useful preview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: american-empire-p4-godot-explorer
          path: |
            ${{ runner.temp }}/american-empire-p4/preview-*.png
            ${{ runner.temp }}/american-empire-p4/proof.mp4
            ${{ runner.temp }}/american-empire-p4/verification.json
            ${{ runner.temp }}/american-empire-p4/world_bundle.json
            ${{ runner.temp }}/american-empire-p4/import.log
            ${{ runner.temp }}/american-empire-p4/godot.log
          if-no-files-found: warn
          retention-days: 30
