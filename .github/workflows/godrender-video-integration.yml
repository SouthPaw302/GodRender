name: GodRender video integration verification
on:
  push:
    branches: [main, integration/full-video-system-20261018]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify every imported Git blob and original Godot sources
        run: python3 tools/verify_consolidation.py
      - name: Syntax-check Studio and imported Python source
        run: python3 -m compileall -q studio upstream godrender_boot.py tools
      - name: Import GodRender core adapter with no production side effects
        run: PYTHONPATH=studio python3 -c 'import core_adapter; assert "AIVideoEdit-MainV2-Lab" in core_adapter.CANONICAL_REMOTE; print("ADAPTER IMPORT PASS")'
  canonical-os-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout GodRender only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Boot actual AIVideoEdit-MainV2-Lab current main (fail closed)
        env:
          AIVE_RUNTIME: ${{ runner.temp }}/godrender-core
        run: python3 godrender_boot.py
