name: GodRender video integration verification
on:
  push:
    branches: [main, integration/full-video-system-20261018, integration/production-runtime-7systems-20261018]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify every imported Git blob and original Godot sources
        run: python3 tools/verify_consolidation.py
      - name: Syntax-check Studio and imported Python source
        run: python3 -m compileall -q studio upstream godrender_boot.py tools
      - name: Import GodRender compatibility adapter without production side effects
        run: PYTHONPATH=studio python3 -c 'import core_adapter; assert core_adapter.CANONICAL_REMOTE == "https://github.com/SouthPaw302/GodRender.git"; assert (core_adapter.HOST_REPO/"bootstrap.py").is_file(); print("GODRENDER NATIVE CORE IMPORT PASS"); print("ADAPTER IMPORT PASS")'
      - name: Check runtime render and branch synchronization APIs
        run: python3 -m compileall -q render studio tools
      - name: Assert GodRender has no external legacy repository dependency
        run: python3 tools/verify_independence.py
      - name: Assert fully native GodRender runtime identifiers
        run: python3 tools/verify_native_identity.py
      - name: Run Studio regression and compatibility tests
        run: PYTHONPATH=studio python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run existing structural Studio self-test
        run: PYTHONPATH=studio python3 studio/selftest.py
      - name: Verify full Studio Python import and tool graph
        run: PYTHONPATH=studio python3 -c 'import stack; print("STUDIO IMPORT PASS", len(stack.all_tool_schemas()))'
      - name: Serve browser Studio and verify HTTP endpoints
        shell: bash
        run: |
          set -euo pipefail
          export GODRENDER_RUNTIME="$RUNNER_TEMP/godrender-studio"
          python3 studio/stack.py > /tmp/godrender-studio.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/godrender-studio.log' EXIT
          ready=0
          for _ in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:8080/api/health > /tmp/studio-health.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:8080/api/system > /tmp/studio-system.json
          curl -fsS http://127.0.0.1:8080/api/core > /tmp/studio-core.json
          python3 -c 'import json; d=json.load(open("/tmp/studio-health.json")); assert d["ok"] is True and d["service"]=="godrender-studio"'
          echo 'BROWSER STUDIO HTTP SMOKE PASS'
  canonical-os-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout GodRender only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Boot native GodRender source and production guards (fail closed)
        env:
          GODRENDER_RUNTIME: ${{ runner.temp }}/godrender-core
          GODRENDER_CORE_REF: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          GODRENDER_VALIDATION_MODE: "1"
        run: python3 godrender_boot.py --offline
