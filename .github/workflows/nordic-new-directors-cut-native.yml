name: Nordic NEW Director Cut - source-canon native FX (60 shots)
on:
  workflow_dispatch:
  push:
    branches: ['song/nordic-remastered']
    paths:
      - '.github/workflows/nordic-new-directors-cut-native.yml'
      - 'projects/nordic-remastered/production/NEW_DIRECTOR_CUT_V1_MANIFEST.json'
      - 'projects/nordic-remastered/production/NEW_DIRECTOR_CUT_V1_FX_REQUIREMENTS.fx.json'
      - 'projects/nordic-remastered/production/render_new_directors_cut.py'
      - 'projects/nordic-remastered/runner_sources/directors-cut-02/**'
permissions:
  contents: read
concurrency:
  group: nordic-new-directors-cut-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native_director:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy opencv-python-headless pillow
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg unzip
      - name: Pin native Main authority without changing production branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git branch --force main refs/remotes/origin/main
          echo "MAIN=$(git rev-parse main)"
          echo "NORDIC=$(git rev-parse HEAD)"
      - name: Verify consolidated GodRender native sources
        run: python tools/verify_consolidation.py
      - name: Boot native GodRender and guardrails
        env:
          GODRENDER_VALIDATION_MODE: '1'
        run: python godrender_boot.py --offline
      - name: Reconstruct original sandbox-to-Git source locks (NO DRIVE)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nordic_new/source" "$RUNNER_TEMP/nordic_new/out"
          cut=projects/nordic-remastered/runner_sources/directors-cut-02
          cat "$cut"/source-a.mp4.b64part* | base64 -d > "$RUNNER_TEMP/nordic_new/source/A.mp4"
          echo "d68af243b94e77f0a7311f99daa6f5b5b4dd9fdfa7a90d3b4b9c002020be6e70  $RUNNER_TEMP/nordic_new/source/A.mp4" | sha256sum -c -
          cat "$cut"/storyboard-b02.zip.b64part* | base64 -d > "$RUNNER_TEMP/nordic_new/source/B02.zip"
          echo "0de98a96c73ebd644d19c49eab1091804f26302e5229a2f32b03f568b585f309  $RUNNER_TEMP/nordic_new/source/B02.zip" | sha256sum -c -
          for batch in 03 04 05; do
            cat "projects/nordic-remastered/runner_sources/batch-$batch/storyboard.zip.part"* > "$RUNNER_TEMP/nordic_new/source/B$batch.zip"
          done
          cat projects/nordic-remastered/runner_sources/batch-06/storyboard.zip.b64part* | base64 -d > "$RUNNER_TEMP/nordic_new/source/B06.zip"
          cat projects/nordic-remastered/runner_sources/batch-03/source_video_b.mp4.part* > "$RUNNER_TEMP/nordic_new/source/B.mp4"
          cat projects/nordic-remastered/runner_sources/audio/Nordic_Remastered.mp3.part* > "$RUNNER_TEMP/nordic_new/source/Nordic_Remastered.mp3"
          echo "156dd5916efc46b148f92a6bbc07ce91271bbff4412b0f4ea4ef22ea37f8c618  $RUNNER_TEMP/nordic_new/source/B03.zip" | sha256sum -c -
          echo "2e2a1d59c4ad76d52ceed915abc3565f7622cff8bf8a5cea1b4a334a90a39564  $RUNNER_TEMP/nordic_new/source/B04.zip" | sha256sum -c -
          echo "e3609729dd069c5f3ef970a27ef9e26d7b0206a07772cd742921030b5b148abe  $RUNNER_TEMP/nordic_new/source/B05.zip" | sha256sum -c -
          echo "ca31e1bef59dd2332e193596a5840c241d22888c6e7242c4c0704f69bccd80b4  $RUNNER_TEMP/nordic_new/source/B06.zip" | sha256sum -c -
          echo "79b7a65bef53cfd35fc9905c9ea4f09ee8a96bcf794e9296596c49d0c5933e68  $RUNNER_TEMP/nordic_new/source/B.mp4" | sha256sum -c -
          echo "d5dc263e6edc7a248503acc1f8ecc5cc2ab91727905ef8ddac3d63a6a1644c2f  $RUNNER_TEMP/nordic_new/source/Nordic_Remastered.mp3" | sha256sum -c -
          echo "ALL ORIGINAL 60-SOURCE PACKAGES, TWO MOTION CLIPS, ONE SONG VERIFIED"
      - name: Verify ONNX scan reused, not rerun
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("projects/nordic-remastered/analysis/ONNX_SCAN_RECEIPT.json").read_text())
          assert r["status"]=="PASS" and r["analysis_engine"]=="beat_this_onnx"
          assert r["audio_sha256"]=="d5dc263e6edc7a248503acc1f8ecc5cc2ab91727905ef8ddac3d63a6a1644c2f"
          assert r["bpm"]==90.91 and r["beat_count"]==210
          m=json.loads(Path("projects/nordic-remastered/production/NEW_DIRECTOR_CUT_V1_MANIFEST.json").read_text())
          assert m["frames"]==3311 and sum(len(s.get("shots",[])) for s in m["sections"])==60
          assert sum(s["total"] for s in m["sections"])==3311
          print("ONNX REUSE / 60-SHOT DIRECTOR MANIFEST PASS")
          PY
      - name: Native FX V2 precompile lock and registered effect proof
        run: |
          python general/reusable/fx_v2/precompile_gate.py \
            --manifest projects/nordic-remastered/production/NEW_DIRECTOR_CUT_V1_FX_REQUIREMENTS.fx.json \
            --lock-out "$RUNNER_TEMP/nordic_new/fx.lock.json"
      - name: Render NEW full-film Director cut via canonical FXExecutor
        env:
          GODRENDER_EXECUTION_LEDGER: ${{ runner.temp }}/nordic_new/out/fx_execution_ledger.jsonl
        run: |
          python -u projects/nordic-remastered/production/render_new_directors_cut.py \
            --manifest projects/nordic-remastered/production/NEW_DIRECTOR_CUT_V1_MANIFEST.json \
            --media "$RUNNER_TEMP/nordic_new/source" \
            --video-a "$RUNNER_TEMP/nordic_new/source/A.mp4" \
            --video-b "$RUNNER_TEMP/nordic_new/source/B.mp4" \
            --audio "$RUNNER_TEMP/nordic_new/source/Nordic_Remastered.mp3" \
            --out "$RUNNER_TEMP/nordic_new/out"
      - name: Full-film 3311-frame and audio/video technical QC
        shell: bash
        run: |
          set -euo pipefail
          film="$RUNNER_TEMP/nordic_new/out/NORDIC_NEW_DIRECTORS_CUT_NATIVE_FX_720p.mp4"
          ffprobe -v error -select_streams v:0 -count_frames \
            -show_entries stream=nb_read_frames,width,height,r_frame_rate \
            -show_entries format=duration,size -of json "$film" | tee "$RUNNER_TEMP/nordic_new/out/ffprobe.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"nordic_new/out/ffprobe.json").read_text())
          v=d["streams"][0]
          assert int(v["nb_read_frames"])==3311 and (v["width"],v["height"])==(1280,720) and v["r_frame_rate"]=="24/1",v
          assert abs(float(d["format"]["duration"])-3311/24)<.06,d
          print("NEW DIRECTOR CUT EXACT 3311 FRAME TECHNICAL QC PASS")
          PY
          ffmpeg -v error -xerror -i "$film" -map 0:v -f null - -map 0:a -f null -
      - name: Upload new film, native FX ledger, receipts and QT proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nordic-new-60-shot-director-cut-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nordic_new/out/NORDIC_NEW_DIRECTORS_CUT_NATIVE_FX_720p.mp4
            ${{ runner.temp }}/nordic_new/out/new_directors_cut_receipt.json
            ${{ runner.temp }}/nordic_new/out/director_shot_execution.json
            ${{ runner.temp }}/nordic_new/out/fx_execution_ledger.jsonl
            ${{ runner.temp }}/nordic_new/out/ffprobe.json
            ${{ runner.temp }}/nordic_new/fx.lock.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
